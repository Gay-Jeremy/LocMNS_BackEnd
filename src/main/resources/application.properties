# Un seul fichier de configuration, une seule source de valeurs : le .env local.
# S'il est absent, le demarrage echoue immediatement sur une variable non resolue,
# ce qui pointe directement vers la bonne cause. Voir .env.example pour le modele.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO}

spring.sql.init.platform=${SQL_FILE}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE}

spring.jpa.properties.jakarta.persistence.validation.mode=none

jwt.secret=${JWT_SECRET}
