name: Java CI with Maven

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # Compilation + tests unitaires : à chaque push et pull request (main et dev)
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compilation et tests
        run: mvn -B package --file pom.xml

      # Bloque la CI si une dépendance (directe ou transitive) a une faille connue (base OSV.dev)
      - name: Audit de sécurité des dépendances
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: --lockfile=./pom.xml

      - name: Conservation du jar pour la publication
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/app.jar

  # Publication de l'image Docker : uniquement après un push sur main
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Récupération du jar compilé et testé
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Installation JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Extraction version depuis pom.xml
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Construction image Docker
        run: docker build -t jeremygaydev/locmns-back .

      - name: Connexion Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image latest
        run: docker push jeremygaydev/locmns-back

      - name: Tag image avec version
        run: docker tag jeremygaydev/locmns-back jeremygaydev/locmns-back:${{ env.VERSION }}

      - name: Push image versionnée
        run: docker push jeremygaydev/locmns-back:${{ env.VERSION }}

  # Déploiement sur le serveur : uniquement après un push sur main
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Copie du docker-compose
        run: |
          mkdir -p ~/locmns
          cp compose.yml ~/locmns/docker-compose.yml

      - name: Déploiement
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker pull jeremygaydev/locmns-back:latest
          docker pull jeremygaydev/locmns-front:latest
          cd ~/locmns
          docker compose down
          docker compose up -d
