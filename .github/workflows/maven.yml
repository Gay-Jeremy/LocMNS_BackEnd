name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Package application
        run: mvn -B clean package --file pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: locmns-back-jar
          path: target/*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jeremygaydev/locmns-back:latest .

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t jeremygaydev/locmns-back:latest .

      - name: Extract version from pom.xml
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Push image latest
        run: docker push jeremygaydev/locmns-back:latest

      - name: Tag image with version
        run: docker tag jeremygaydev/locmns-back:latest jeremygaydev/locmns-back:${{ env.VERSION }}

      - name: Push image versioned
        run: docker push jeremygaydev/locmns-back:${{ env.VERSION }}

  deploy:
    runs-on: self-hosted
    needs: docker-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copie du docker-compose
        run: cp compose.yml ~/locmns/docker-compose.yml

      - name: Déploiement
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker pull jeremygaydev/locmns-back:latest
          cd ~/locmns
          docker compose up -d