# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Compilation Maven
        run: mvn -B package --file pom.xml

      - name: Construction image Docker
        run: docker build -t jeremygaydev/locmns-back .

      - name: Connexion Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image latest
        run: docker push jeremygaydev/locmns-back

      - name: Extraction version depuis pom.xml
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Tag image avec version
        run: docker tag jeremygaydev/locmns-back jeremygaydev/locmns-back:${{ env.VERSION }}

      - name: Push image versionnée
        run: docker push jeremygaydev/locmns-back:${{ env.VERSION }}

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Copie du docker-compose
        run: |
          mkdir -p /opt/locmns
          cp compose.yml ~/locmns/docker-compose.yml

      - name: Déploiement
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker pull jeremygaydev/locmns-back:latest
           cd ~/locmns
          docker compose up -d