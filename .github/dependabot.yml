# Mises à jour automatiques des dépendances (voir README, section « Sécurité des dépendances »)
version: 2
updates:
  # Dépendances Maven : une pull request groupée par semaine, vers dev, testée par la CI
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Spring Boot fixe les versions de Spring, Tomcat, Jackson, Hibernate, du pilote PostgreSQL...
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
        update-types:
          - "minor"
          - "patch"
      autres-dependances:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Les versions majeures (ex. Spring Boot 5) se font à la main, avec les guides de migration
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Actions GitHub utilisées par la CI
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
