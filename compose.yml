services:
  postgres:
    image: postgres:18
    container_name: postgres_container_locmns_BackEnd
    env_file:
      - .env
    # Port publie uniquement sur la boucle locale : necessaire pour lancer
    # l'application depuis l'IDE, sans exposer la base sur le reseau.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend

  back:
    image: jeremygaydev/locmns-back
    ports:
      - "8080:8080"
    env_file:
      - .env
    # Dans le reseau Compose, la base se joint par le nom du service.
    # Ces valeurs ecrasent celles du .env, qui decrivent un lancement hors conteneur.
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres
    networks:
      - backend

  front:
    image: jeremygaydev/locmns-front
    ports:
      - "80:80"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
