services:
  postgres:
    image: postgres:18
    container_name: postgres_container_locmns_BackEnd
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: locmns_db
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    image: jeremygaydev/locmns-back:latest
    ports:
      - "8080:8080"

volumes:
  postgres_data: